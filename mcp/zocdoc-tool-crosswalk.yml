  agent_skill:
    source: https://github.com/Zocdoc/zocdoc-agent-skill
    surface: public-website
    note: Captured verbatim in skills/.
crosswalk:
  - tool: providerLocationsAvailability
    binding: graphql
    category: availability
    rest:
      - getProviderLocationsAvailability
    confidence: medium
    note: >-
      Same capability, different contract. The GraphQL operation returns
      `availability.times[].timeslots[].startTime` for composite
      `provider_id|location_id` ids with no auth; the REST operation returns
      `AvailabilityResult` for `provider_location_ids` under
      `external.schedulable_entity.read` / anonymous-token scope and adds
      insurance, visit-reason and patient-type inputs the GraphQL query does not
      expose. Confidence is medium because the GraphQL response schema could not
      be introspected.
  - tool: zocdoc-doctor-finder / provider search
    binding: agent-skill
    category: discovery
    rest:
