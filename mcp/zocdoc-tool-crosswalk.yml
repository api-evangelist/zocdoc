      - getProviders
    confidence: low
    note: >-
      The published skill reads providers out of `window.__REDUX_STATE__` on
      zocdoc.com search pages rather than calling any documented API. The REST
      operations are the partner-API equivalents of the same capability, not the
      code path the skill takes.
  - tool: zocdoc-doctor-finder / provider reviews and ratings
    binding: agent-skill
    category: reputation
    rest:
      - getProviderReviews
      - getProviderReviewsBatch
    confidence: low
    note: >-
      Skill reads `averageRating` / `reviewCount` off the rendered page; REST
      exposes the same data as a first-class resource (batch form added
      July 2026).
