source: >-
  openapi/ (v1.177, 32 operations) + the GraphQL surface Zocdoc documents in its
  own agent-skill repo (https://github.com/Zocdoc/zocdoc-agent-skill) + live
  probe of https://api.zocdoc.com/directory/v3/gql
note: >-
  Zocdoc runs TWO non-overlapping surfaces and they serve different audiences.
  The PARTNER REST API (api-developer.zocdoc.com, OAuth 2.0, contract-gated
  onboarding) is the one with an OpenAPI. The PUBLIC DIRECTORY GraphQL endpoint
  (api.zocdoc.com/directory/v3/gql) is what zocdoc.com itself calls and what
  Zocdoc's own published Agent Skill drives — anonymous, browser-session-bound,
  and with introspection disabled. There is no MCP server, so the crosswalk
  binds GraphQL operations and published-skill capabilities to REST
  operationIds instead of MCP tools. Nothing here is invented: every REST
  operationId below is verbatim from the spec, and every GraphQL operation name
  is verbatim from Zocdoc's own repository.
surfaces:
  openapi:
    path: openapi/
    spec_version: '1.177'
    servers:
      - https://api-developer.zocdoc.com
      - https://api-developer-sandbox.zocdoc.com
    operations: 32
    gated: partner-onboarding
    note: >-
      The spec is public at https://api-docs.zocdoc.com/_bundle/apis/index.yaml;
      credentials are not — client_id/client_secret are issued per partner.
  graphql:
    endpoint: https://api.zocdoc.com/directory/v3/gql
    gated: true
    introspection: disabled
    probe:
