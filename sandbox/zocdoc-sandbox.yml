webhook_simulation:
  endpoint: POST /v1/webhook/mock-request
  operation_id: mockWebhookRequest
  environment: sandbox only
  inputs: [webhook_url, webhook_key, appointment_update_type]
  http_allowed: true
  note: >-
    Sandbox is the only place Zocdoc permits a plain-HTTP webhook receiver, and
    the only place any base64 string works as the signing key. Zocdoc's docs
    name webhook.site as an acceptable receiver and publish an example sandbox
    key value in the guide.
gaps:
  - No self-serve sandbox signup — credentials are issued by Zocdoc per partner.
  - No test clocks / time travel; availability windows are relative to real time.
  - No fixture reset or seed-data API.
