generated: '2026-08-15'
method: searched
source: https://api-docs.zocdoc.com/guides/testing-data
docs:
  testing: https://api-docs.zocdoc.com/guides/testing-data
  authentication: https://api-docs.zocdoc.com/guides/authentication
  webhooks: https://api-docs.zocdoc.com/guides/webhooks
note: >-
  Zocdoc publishes a genuinely strong sandbox: a fully separate environment with
  its own credentials and its own authorization server, plus a published table
  of magic identifiers that force every appointment status and every error class
  deterministically. Every value below is quoted verbatim from Zocdoc's own
  testing-data page — none are invented. There are no "test cards" here; the
  payments-shaped equivalent is the magic `pr_*|lo_*` provider-location ids and
  the fixed appointment UUIDs.
environments:
  - mode: sandbox
    base_url: https://api-developer-sandbox.zocdoc.com
    token_url: https://auth-api-developer-sandbox.zocdoc.com/oauth/token
    audience_m2m: https://api-developer-sandbox.zocdoc.com/
    audience_user: DeveloperApiPatient-Sandbox
    credentials: separate client_id / client_secret issued per partner
    self_serve: false
  - mode: production
    base_url: https://api-developer.zocdoc.com
    token_url: https://auth.zocdoc.com/oauth/token
    audience_m2m: https://api-developer.zocdoc.com/
    audience_user: DeveloperApiPatient
    credentials: separate client_id / client_secret issued per partner
    self_serve: false
separation:
  key_prefixes: none
  mechanism: >-
    Separate hosts, separate authorization servers and separate audiences rather
    than a key prefix. A token minted for one environment is rejected by the
    other — Zocdoc names this mismatch as the first thing to check on a 401.
  credential_distribution: >-
    Sandbox secrets may be distributed to developers; production secrets are
    restricted to secure backend services (Zocdoc's stated policy).
test_clocks: false
time_simulation: false
magic_values:
  - surface: GET /v1/providers
    parameter: npis
    values:
      - {value: npi_error, effect: 500 error response}
      - {value: npi_missing, effect: no matching providers}
      - {value: npi_multipleproviders, effect: multiple matching providers}
      - {value: npi_multiplelocations, effect: provider with multiple locations}
      - {value: npi_allvirtual, effect: provider with one virtual location}
      - {value: npi_hasvirtual, effect: provider with both in-person and virtual locations}
      - {value: npi_insuranceIdRequired, effect: provider requiring insurance member id and plan id}
  - surface: GET /v1/provider_locations
    parameter: zip_code
    values:
      - {value: '10112', effect: 500 error response}
      - {value: '99734', effect: no matching provider locations}
      - {value: '11201', effect: response includes booking requirements}
  - surface: provider_location_id (multiple endpoints)
    parameter: provider_location_id
    values:
      - {value: pr_error / lo_error, effect: 500 error response}
      - {value: pr_missing / lo_missing, effect: 404 error response}
      - {value: pr_insuranceIdIsRequired / lo_insuranceIdIsRequired, effect: returns booking requirements; 400 on book if insurance omitted}
      - {value: pr_selfPayNotAccepted / lo_selfPayNotAccepted, effect: self-pay refused; 400 on book when is_self_pay true}
      - {value: pr_acceptsInNetworkOnly / lo_acceptsInNetworkOnly, effect: in-network only; 400 on book when a plan is supplied}
      - {value: pr_no_availbility / lo_no_availbility, effect: availability returns empty (Zocdoc's spelling)}
      - {value: pr_noAcceptedInsurancePla / lo_noAcceptedInsurancePla, effect: empty insurance mappings}
      - {value: pr_allInsurancePlansAccep / lo_allInsurancePlansAccep, effect: full insurance mappings; 202 on mapping update}
      - {value: pr_ip_mapping_level_prac / lo_ip_mapping_level_prac, effect: 409 — mappings managed at practice level}
      - {value: pr_ip_mapping_level_prov / lo_ip_mapping_level_prov, effect: 409 — mappings managed at provider level}
  - surface: POST /v1/appointments — status forcing
    parameter: provider_location_id
    values:
      - {value: pr_pending / lo_pending, effect: returns a pending_booking appointment}
      - {value: pr_confirmed / lo_confirmed, effect: returns a confirmed appointment}
      - {value: pr_bookingfailed / lo_bookingfailed, effect: returns a booking_failed appointment}
      - {value: pr_cancelled / lo_cancelled, effect: returns a cancelled appointment}
      - {value: pr_noshow / lo_noshow, effect: returns a no_show appointment}
      - {value: pr_pendingreschedule / lo_pendingreschedule, effect: returns a pending_reschedule appointment}
      - {value: pr_rescheduled / lo_rescheduled, effect: returns a rescheduled appointment}
      - {value: pr_reschedulefailed / lo_reschedulefailed, effect: returns a reschedule_failed appointment}
  - surface: GET /v1/insurance_plans/{insurance_plan_id}
    parameter: insurance_plan_id
    values:
      - {value: ip_0, effect: 400 on search endpoints / 404 on direct lookup}
      - {value: ip_5432, effect: national coverage plan}
      - {value: ip_2345, effect: CA state coverage}
      - {value: ip_2052, effect: Medicare plan}
      - {value: ip_8281, effect: Medicaid plan}
      - {value: ip_9111, effect: active status}
      - {value: ip_2667, effect: inactive status}
      - {value: ip_5292, effect: deleted status}
      - {value: ip_2600, effect: health plan}
      - {value: ip_6501, effect: dental plan}
      - {value: ip_5907, effect: vision plan}
  - surface: GET /v1/insurance_plans
    parameter: state
    values:
      - {value: AK, effect: empty list of plans}
  - surface: GET /v1-beta/facilities
    parameter: npis
    values:
      - {value: '2988113970', effect: NPI corresponding to one facility}
      - {value: '5884143085', effect: NPI corresponding to multiple facilities}
  - surface: PUT /v1/schedulable_entities/overlaps
    parameter: npi
    values:
      - {value: npi_overlaps_not_found, effect: schedulable status NotSchedulable}
      - {value: npi_overlaps_pending, effect: schedulable status AddedToQueue}
