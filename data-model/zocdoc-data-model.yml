traversal:
  canonical_booking_path:
    - getProviderNpis or getSchedulableEntities — cache the directory
    - getProviders (by NPI) or getProviderLocations (by zip + specialty/visit reason) — obtain provider_location_id
    - getProviderLocationsAvailability — obtain start_time for a provider_location_id + visit_reason_id + patient_type
    - createAppointment — book that exact start_time
    - getAppointment — poll status until it leaves pending_booking
  note: >-
    The graph is strictly directional for booking: only a `start_time` returned
    by getProviderLocationsAvailability is accepted by createAppointment.
