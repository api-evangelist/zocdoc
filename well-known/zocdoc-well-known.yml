note: >-
  Only auth.zocdoc.com serves a real /.well-known document. The API hosts
  (api-developer.zocdoc.com, api-developer-sandbox.zocdoc.com) 404 every path.
  api-docs.zocdoc.com answers /.well-known/oauth-authorization-server with the
  Redocly documentation platform's OWN authorization server
  (issuer https://auth.cloud.redocly.com) — that document belongs to Redocly,
  the docs vendor, not to Zocdoc, so it is recorded but NOT saved as a Zocdoc
  artifact. developer.zocdoc.com answers 200 with an HTML SPA shell for every
  /.well-known/* path (including agent-card.json and agent.json) — a catch-all,
  not a document; treated as a miss.
