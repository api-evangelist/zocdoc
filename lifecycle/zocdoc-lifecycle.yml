  window_observed: 2025-08 through 2026-07
  months_with_entries: 12
  note: >-
    Zocdoc has shipped a dated changelog entry every month for a year. Entries
    are grouped Added / Improved. No "Removed", "Deprecated" or "Breaking"
    section has ever appeared, which is why the credentials withdrawal above is
    invisible in the changelog.
